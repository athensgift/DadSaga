included:
  - App
  - Widget
  - Packages/DadSagaKit/Sources
  - Packages/DadSagaKit/Tests
  - Tools
  - UITests
  - SnapshotTests

excluded:
  - Packages/DadSagaKit/.build
  - Tools/LaunchLogo/.build
  - Tools/SagaMusic/.build

opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - sorted_first_last
  - implicit_return

line_length:
  warning: 130
  error: 160

identifier_name:
  excluded: [id, el, en, xs, s, m, l, xl, xp]

force_cast: error
force_try: error

custom_rules:
  # ADR-0007, ADR-0037 §1: a presenter never draws. It hands display models to views and a script to the film renderer.
  view_model_imports:
    name: "View model imports"
    included: "Packages/DadSagaKit/Sources/.*ViewModel.*\\.swift$"
    regex: "^import (SwiftUI|UIKit|AVFoundation|AVKit|FilmKit|HeroArt|DesignSystem)\\b"
    message: "A view model imports no UI, media or drawing framework (ADR-0037 §1)."
    severity: error
