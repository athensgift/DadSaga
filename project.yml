name: DadSaga

options:
  bundleIdPrefix: com.athinodoros
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: el

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  DadSagaKit:
    path: Packages/DadSagaKit

targets:
  DadSaga:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DadSagaKit
        product: Domain
      - package: DadSagaKit
        product: Application
      - package: DadSagaKit
        product: Data
      - package: DadSagaKit
        product: Presentation
      - package: DadSagaKit
        product: DesignSystem
      - target: DadSagaWidget
    entitlements:
      path: App/DadSaga.entitlements
      properties:
        com.apple.security.application-groups: [group.com.athinodoros.dadsaga]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DadSaga
        CFBundleURLTypes:
          - CFBundleURLName: com.athinodoros.dadsaga
            CFBundleURLSchemes: [dadsaga]
        CFBundleDevelopmentRegion: el
        CFBundleLocalizations: [el, en]
        UILaunchScreen: {}
        NSCameraUsageDescription: Take a photo for a legendary moment. Photos stay on this device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athinodoros.dadsaga
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  # Home-screen widget (ADR-0023). Never links Presentation; WidgetContainer is its own composition root.
  DadSagaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    dependencies:
      - package: DadSagaKit
        product: Domain
      - package: DadSagaKit
        product: Application
      - package: DadSagaKit
        product: Data
      - package: DadSagaKit
        product: DesignSystem
      - package: DadSagaKit
        product: WidgetPresentation
    entitlements:
      path: Widget/DadSagaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.athinodoros.dadsaga]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DadSaga
        CFBundleDevelopmentRegion: el
        CFBundleLocalizations: [el, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athinodoros.dadsaga.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
