name: DadSaga

options:
  bundleIdPrefix: com.athinodoros
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # The language a phone with neither Greek nor English gets from the system: English, as the app's own text (ADR-0077).
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  DadSagaKit:
    path: Packages/DadSagaKit
  # Screen snapshots only (ADR-0034); never linked by the app or the widget.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7

targets:
  DadSaga:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DadSagaKit
        product: Domain
      - package: DadSagaKit
        product: Application
      - package: DadSagaKit
        product: Data
      - package: DadSagaKit
        product: Presentation
      - package: DadSagaKit
        product: DesignSystem
      # The saga film's music (ADR-0036 §8): the app only, never the widget.
      - package: DadSagaKit
        product: SagaMusic
      - target: DadSagaWidget
    entitlements:
      path: App/DadSaga.entitlements
      properties:
        com.apple.security.application-groups: [group.com.athinodoros.dadsaga]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DadSaga
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption of its own, only Apple's: no export compliance question for each build (ADR-0051).
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.athinodoros.dadsaga
            CFBundleURLSchemes: [dadsaga]
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [el, en]
        # Always show the per-app language in iOS Settings; Settings' language row opens it (ADR-0030).
        UIPrefersShowingLanguageSettings: true
        # Settings' contact, rate/share and privacy rows (ADR-0030). An empty value hides its row. The privacy URL of
        # each language is in InfoPlist.xcstrings.
        DadSagaFeedbackAddress: "hello@dadsaga.app"
        DadSagaAppStoreID: ""
        DadSagaPrivacyPolicyURL: "https://dadsaga.app/privacy/"
        # Native launch screen (ADR-0025): Super Dad with a baby on DSColor.background, light and dark.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        NSCameraUsageDescription: Take a photo for an entry. Photos stay on this device.
        # The share sheet's "Save Video" for a saga film (ADR-0036 §6).
        NSPhotoLibraryAddUsageDescription: Save your saga film to Photos.
        # An exported saga, `.dadsaga` (ADR-0057 §3): public.content lets it go over AirDrop. Opening one with the app
        # (CFBundleDocumentTypes) waits for v1.x.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.dadsaga.saga-copy
            UTTypeDescription: DadSaga copy
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [dadsaga]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athinodoros.dadsaga
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [DadSagaUITests]

  # The main screens as images (ADR-0034), on a fixed saga of their own. Hosted by the app, which then runs on test
  # data (`DeviceData`): Liquid Glass is only drawn in a real window.
  DadSagaSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapshotTests
        excludes: ["**/__Snapshots__/**"]
    # DadSagaKit comes from the app it is injected into: linking it here too would give the bundle second copies of
    # its modules, whose environment keys the app's views never read.
    dependencies:
      - package: SnapshotTesting
        product: SnapshotTesting
      - target: DadSaga
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DadSaga.app/DadSaga
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: com.athinodoros.dadsaga.snapshottests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  # Drives the app on a simulator: the accessibility audit of every screen, and Settings following Appearance (ADR-0049).
  DadSagaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: DadSaga
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athinodoros.dadsaga.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  # Home-screen widget (ADR-0023). Never links Presentation; WidgetContainer is its own composition root.
  DadSagaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    dependencies:
      - package: DadSagaKit
        product: Domain
      - package: DadSagaKit
        product: Application
      - package: DadSagaKit
        product: Data
      - package: DadSagaKit
        product: DesignSystem
      - package: DadSagaKit
        product: WidgetPresentation
    entitlements:
      path: Widget/DadSagaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.athinodoros.dadsaga]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DadSaga
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [el, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.athinodoros.dadsaga.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  # The screen snapshots (ADR-0034), on a region and time zone of their own: iOS formats dates (the date picker) by the
  # simulator's region, which differs between Macs and CI. Only this scheme's test action sets them.
  DadSagaSnapshots:
    build:
      targets:
        DadSaga: all
        DadSagaSnapshotTests: [test]
    test:
      targets: [DadSagaSnapshotTests]
      commandLineArguments:
        "-AppleLocale en_US": true
        "-AppleLanguages (en)": true
      environmentVariables:
        TZ: UTC
