name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint --strict

      - name: Package tests
        working-directory: Packages/DadSagaKit
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (simulator)
        run: |
          xcodebuild build \
            -project DadSaga.xcodeproj \
            -scheme DadSaga \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
