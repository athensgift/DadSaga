name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:

permissions:
  contents: read

# On a PR, a newer push stops the run it replaces. Every push to develop, main or a release branch is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The tools are pinned like Xcode, so a new SwiftLint rule or XcodeGen release never fails an unrelated PR (ADR-0034).
# Each comes from its GitHub release, checked against the SHA-256 GitHub lists for that asset. To move one, change the
# version and its checksum together.
env:
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # The package tests and the simulator builds took 2 to 5 minutes each, one after the other in one job: typically 7 to
  # 9 minutes a run (22 to 25 November 2026). The same code takes up to twice as long from run to run: that is the
  # runner. Side by side, a pull request waits for the slower of the two (ADR-0074).
  #
  # `main` and `develop` require `package-tests` and `app-build` by name before a merge (ADR-0076). Renaming or
  # splitting either, or adding a job a merge must wait for, changes the ruleset at the same moment. Neither gets an
  # `if:` (GitHub counts a skipped required check as passed), and the workflow gets no path filter (a workflow that
  # doesn't run leaves the check waiting, and the merge blocked).
  package-tests:
    # Pinned to the Mac's Xcode, so an image update never changes the toolchain under us (ADR-0034).
    runs-on: xcode-27
    # A test parked in a wait it can't cancel (a stalled AVAssetWriter, ADR-0036) outlives Swift Testing's time limit,
    # so the job stops here instead of after GitHub's six hours.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          swiftlint version
          swiftlint --strict

      - name: Package tests
        working-directory: Packages/DadSagaKit
        run: swift test --build-system swiftbuild

  app-build:
    # Pinned as above (ADR-0034).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      # The UI tests and the screen snapshots run on the Mac (ADR-0034); here they are only compiled, so they never
      # fall behind the app. The first also builds the app for the simulator.
      - name: Build app (simulator), UI tests and snapshots
        run: |
          xcodebuild build-for-testing \
            -project DadSaga.xcodeproj \
            -scheme DadSaga \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build-for-testing \
            -project DadSaga.xcodeproj \
            -scheme DadSagaSnapshots \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # What only a release build compiles: the `#else` of `#if DEBUG`, and the optimised build (ADR-0051). Not on a PR
  # into develop, which it would only slow down: after every merge into develop, on a release branch and on its way
  # into main (ADR-0062).
  release-build:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (Release)
        run: |
          xcodebuild build \
            -project DadSaga.xcodeproj \
            -scheme DadSaga \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
