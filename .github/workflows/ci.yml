name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned to the Mac's Xcode, so an image update never changes the toolchain under us (ADR-0034). The screen
    # snapshots run on the Mac, not here.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint --strict

      - name: Package tests
        working-directory: Packages/DadSagaKit
        run: swift test --build-system swiftbuild

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (simulator)
        run: |
          xcodebuild build \
            -project DadSaga.xcodeproj \
            -scheme DadSaga \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
